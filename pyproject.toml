[project]
name = "tuco"
version = "0.1.0"
description = "SOC-focused network investigation workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "scapy>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
